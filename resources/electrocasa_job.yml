resources:
  jobs:
    electrocasa_job:
      name: electrocasa_${bundle.target}_daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: '0 0 7 * * ?'
        timezone_id: America/Lima
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: ingest_snapshots
          notebook_task:
            notebook_path: ../notebooks/01_ingest_snapshots.ipynb
            base_parameters:
              catalog: ${var.catalog}
              foreign_catalog: ${var.foreign_catalog}
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: refresh_medallion
          depends_on:
            - task_key: ingest_snapshots
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_pipeline.id}
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: verify_outputs
          depends_on:
            - task_key: refresh_medallion
          notebook_task:
            notebook_path: ../notebooks/02_verify.ipynb
            base_parameters:
              catalog: ${var.catalog}
          max_retries: 1
        - task_key: apply_governance
          depends_on:
            - task_key: verify_outputs
          notebook_task:
            notebook_path: ../notebooks/03_governance.ipynb
            base_parameters:
              catalog: ${var.catalog}
